name: smoke

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build test binary
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Check Rust coverage
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo llvm-cov --all-targets --locked --fail-under-lines 80
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Test installer
        run: ./scripts/install-test.sh
      - name: Check Windows installer contract
        run: ./scripts/windows-install-test.sh
      - name: Native Linux installer/update E2E
        run: ./scripts/native-linux-install-update-test.sh
      - name: Smoke test
        run: ./scripts/smoke-test.sh

  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build test binary
        shell: pwsh
        run: cargo build --locked
      - name: Native Windows installer/update E2E with Windows PowerShell
        shell: powershell
        run: ./scripts/native-windows-install-update-test.ps1
      - name: Native Windows installer/update E2E with PowerShell Core
        shell: pwsh
        run: ./scripts/native-windows-install-update-test.ps1
      - name: Test Windows installer with Windows PowerShell
        shell: powershell
        run: ./scripts/windows-parser-test.ps1
      - name: Test Windows installer with PowerShell Core
        shell: pwsh
        run: ./scripts/windows-parser-test.ps1
