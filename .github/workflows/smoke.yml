name: smoke

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.13', coverage: true }
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: macos-15, python: '3.13' }
          - { os: windows-2022, python: '3.13' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-cov
      - name: Test (with the 80% line-coverage gate)
        if: matrix.coverage
        run: python -m pytest --cov=remote_code_bridge --cov-report=term-missing --cov-fail-under=80
      - name: Test
        if: ${{ !matrix.coverage }}
        run: python -m pytest

  # Install the way users do (`uv tool install`), then run, uninstall and remove it.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: uv tool install, run, uninstall
        shell: bash
        run: |
          uv tool install .
          export PATH="$(uv tool dir --bin):$PATH"
          remote-code-bridge --version
          remote-code-bridge generate-token
          remote-code-bridge uninstall --yes
          uv tool uninstall remote-code-bridge
          ! command -v remote-code-bridge

  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Smoke test the single-file copy sent to remotes
        run: ./scripts/smoke-test.sh
      - name: End-to-end against a real sshd (install, sessions, recovery, update, uninstall)
        run: ./scripts/native-linux-install-update-test.sh
