name: smoke

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build test binary
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Check Rust coverage
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo llvm-cov --all-targets --locked --fail-under-lines 80
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Test installer
        run: ./scripts/install-test.sh
      - name: Check Windows installer contract
        run: ./scripts/windows-install-test.sh
      - name: Smoke test
        run: ./scripts/smoke-test.sh
