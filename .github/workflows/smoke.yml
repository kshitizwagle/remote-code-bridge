name: smoke

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check installer syntax
        run: sh -n install.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.13', coverage: true }
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: macos-15, python: '3.13' }
          - { os: windows-2022, python: '3.13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-cov
      - name: Test (with the 80% line-coverage gate)
        if: matrix.coverage
        run: python -m pytest --cov=remote_code_bridge --cov-report=term-missing --cov-fail-under=80
      - name: Test
        if: ${{ !matrix.coverage }}
        run: python -m pytest
      - name: Parse install.ps1 with Windows PowerShell and PowerShell Core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($shell in 'powershell', 'pwsh') {
            & $shell -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e) { $e; exit 1 }'
            if ($LASTEXITCODE) { exit 1 }
          }

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Smoke test the release archive
        run: ./scripts/smoke-test.sh
      - name: End-to-end against a real sshd (install, concurrent sessions, recovery, update)
        run: ./scripts/native-linux-install-update-test.sh
