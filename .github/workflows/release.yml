name: release

# Publishes a release to PyPI (where `uv tool install remote-code-bridge` and
# `remote-code-bridge update` get it) and to GitHub Releases. Push a v* tag, or run it by hand.
# PyPI accepts the upload through trusted publishing: no token is stored in this repository.

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number, for example 2.0.0 (the v prefix is optional)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            case "$INPUT_VERSION" in v*) tag=$INPUT_VERSION ;; *) tag="v$INPUT_VERSION" ;; esac
            ref=master
          else
            tag=${RELEASE_TAG:-$REF_NAME}
            ref=$tag
          fi
          version="${tag#v}"
          case "$version" in
            ''|.*|*.|*..*|*[!0-9.]*) echo 'version must contain only numbers and dots' >&2; exit 1 ;;
          esac
          printf 'tag=%s\nref=%s\nversion=%s\n' "$tag" "$ref" "$version" >> "$GITHUB_OUTPUT"
      # A release target must be a branch or a commit, not a tag name.
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - name: Check the package version matches the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          found=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' remote_code_bridge/__init__.py)
          [ "$found" = "$VERSION" ] || { echo "remote_code_bridge/__init__.py says $found, the tag says $VERSION" >&2; exit 1; }
          found=$(sed -n 's/^version = "\(.*\)".*/\1/p' pyproject.toml)
          [ "$found" = "$VERSION" ] || { echo "pyproject.toml says $found, the tag says $VERSION" >&2; exit 1; }
      - name: Test
        run: uv run --no-project --with pytest python -m pytest
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/remote-code-bridge/
    permissions:
      contents: write  # the GitHub release
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      # A tag push and the release it creates both run this workflow; --check-url skips files already on PyPI.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes dist/*
          fi
