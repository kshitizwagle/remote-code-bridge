name: release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number, for example 2.0.0 (the v prefix is optional)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            case "$INPUT_VERSION" in v*) tag=$INPUT_VERSION ;; *) tag="v$INPUT_VERSION" ;; esac
            ref=master
          else
            tag=${RELEASE_TAG:-$REF_NAME}
            ref=$tag
          fi
          version="${tag#v}"
          case "$version" in
            ''|.*|*.|*..*|*[!0-9.]*) echo 'version must contain only numbers and dots' >&2; exit 1 ;;
          esac
          printf 'tag=%s\nref=%s\nversion=%s\n' "$tag" "$ref" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test
        run: |
          python -m pip install pytest
          python -m pytest
      - name: Build the release archive and version-pinned installers
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/build.sh "$VERSION"
          sed "s#releases/latest/download#releases/download/${RELEASE_TAG}#" install.sh > dist/install.sh
          sed "s#releases/latest/download#releases/download/${RELEASE_TAG}#" install.ps1 > dist/install.ps1
          chmod 755 dist/install.sh
          (cd dist && sha256sum install.sh > install.sh.sha256 && sha256sum install.ps1 > install.ps1.sha256)
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_REF: ${{ steps.version.outputs.ref }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_REF" --title "$RELEASE_TAG" --generate-notes dist/*
          fi
