name: release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check Rust coverage
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo llvm-cov --all-targets --locked --fail-under-lines 80
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Test installer
        run: ./scripts/install-test.sh
      - name: Smoke test
        run: ./scripts/smoke-test.sh

  build-release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - name: Install Linux musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          mkdir dist
          cp target/${{ matrix.target }}/release/remote-code-bridge dist/remote-code-bridge-${{ matrix.target }}
          if command -v sha256sum >/dev/null; then
            sha256sum dist/remote-code-bridge-${{ matrix.target }} > dist/remote-code-bridge-${{ matrix.target }}.sha256
          else
            shasum -a 256 dist/remote-code-bridge-${{ matrix.target }} > dist/remote-code-bridge-${{ matrix.target }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Pin installer to this release
        run: |
          sed "s#releases/latest/download#releases/download/${RELEASE_TAG}#" install.sh > dist/install.sh
          chmod 755 dist/install.sh
          (cd dist && sha256sum install.sh > install.sh.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" dist/*
          fi
