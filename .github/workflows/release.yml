name: release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
      - '[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number, for example 1.1.0 (the v prefix is optional)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build test binary
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Check Rust coverage
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo llvm-cov --all-targets --locked --fail-under-lines 80
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Test installer
        run: ./scripts/install-test.sh
      - name: Check Windows installer contract
        run: ./scripts/windows-install-test.sh
      - name: Native Linux installer/update E2E
        run: ./scripts/native-linux-install-update-test.sh
      - name: Smoke test
        run: ./scripts/smoke-test.sh

  build-release:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          mkdir dist
          cp target/${{ matrix.target }}/release/remote-code-bridge dist/remote-code-bridge-${{ matrix.target }}
          if command -v sha256sum >/dev/null; then
            sha256sum dist/remote-code-bridge-${{ matrix.target }} > dist/remote-code-bridge-${{ matrix.target }}.sha256
          else
            shasum -a 256 dist/remote-code-bridge-${{ matrix.target }} > dist/remote-code-bridge-${{ matrix.target }}.sha256
          fi
      - name: Test Windows installer with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows-parser-test.ps1
      - name: Test Windows installer with PowerShell Core
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-parser-test.ps1
      - name: Build test binary for native installer/update E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked
      - name: Native Windows installer/update E2E with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/native-windows-install-update-test.ps1
      - name: Native Windows installer/update E2E with PowerShell Core
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/native-windows-install-update-test.ps1
      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = 'remote-code-bridge-${{ matrix.target }}.exe'
          Copy-Item "target/${{ matrix.target }}/release/remote-code-bridge.exe" "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  prepare:
    if: github.ref_type == 'tag' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.event.release.tag_name || github.ref_name }}
          persist-credentials: false
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            raw=$INPUT_VERSION
            ref=master
            case "$raw" in
              v*) tag=$raw ;;
              *) tag="v$raw" ;;
            esac
          else
            tag=$RELEASE_TAG
            [ -n "$tag" ] || tag=$REF_NAME
            ref=$tag
          fi
          version="${tag#v}"
          case "$version" in
            ''|.*|*.|*..*|*[!0-9.]*) echo 'version must contain only numbers and dots' >&2; exit 1 ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - id: sha
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  find-artifacts:
    needs: prepare
    if: github.ref_type == 'tag' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow release.yml --limit 100 \
            --json databaseId,headSha,event,status,conclusion \
            --jq "[.[] | select(.headSha == \"$SHA\" and .event == \"push\" and .status == \"completed\" and .conclusion == \"success\")][0].databaseId")
          if [ -z "$run_id" ] || [ "$run_id" = null ]; then
            echo "::error::No successful push-triggered build found for commit $SHA. Push this commit to master and let CI build it before creating a release." >&2
            exit 1
          fi
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

  publish:
    needs: [prepare, find-artifacts]
    if: github.ref_type == 'tag' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_REF: ${{ needs.prepare.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Download build artifacts from prior successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.find-artifacts.outputs.run_id }}" --repo "${{ github.repository }}" --dir dist
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
      - name: Pin installer to this release
        run: |
          sed "s#releases/latest/download#releases/download/${RELEASE_TAG}#" install.sh > dist/install.sh
          sed "s#releases/latest/download#releases/download/${RELEASE_TAG}#" install.ps1 > dist/install.ps1
          chmod 755 dist/install.sh
          (cd dist && sha256sum install.sh > install.sh.sha256 && sha256sum install.ps1 > install.ps1.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_REF" --title "$RELEASE_TAG" --generate-notes dist/*
          fi
