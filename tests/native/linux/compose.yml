services:
  remote:
    build: .
    command: /usr/local/bin/remote-entrypoint.sh
    volumes:
      - "${RCB_PUBLIC_DIR:?RCB_PUBLIC_DIR is required}:/public:ro"

  host:
    build: .
    depends_on:
      - remote
    user: "${RCB_UID:?RCB_UID is required}:${RCB_GID:?RCB_GID is required}"
    volumes:
      - "../../../:/repo:ro"
      - "${RCB_FIXTURE_DIR:?RCB_FIXTURE_DIR is required}:/fixture"
      - "${RCB_PUBLIC_DIR:?RCB_PUBLIC_DIR is required}:/public"
