[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[project]
name = "remote-code-bridge"
version = "2.1.0"  # keep equal to __version__ in remote_code_bridge/__init__.py (a test checks)
description = "Run `code .` in any SSH session on a Linux remote and open it in VS Code on your own machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kshitiz Wagle" }]
requires-python = ">=3.8"
dependencies = []  # standard library only, on purpose
keywords = ["vscode", "ssh", "remote-development", "tunnel"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/kshitizwagle/remote-code-bridge"
Issues = "https://github.com/kshitizwagle/remote-code-bridge/issues"

[project.scripts]
remote-code-bridge = "remote_code_bridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6"]

[tool.uv.build-backend]
module-root = ""  # the package sits at the top of the repository, not under src/
source-include = ["tests/**", "docs/**"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Print every thread's stack if a test hangs, instead of silently timing out in CI.
faulthandler_timeout = 60
