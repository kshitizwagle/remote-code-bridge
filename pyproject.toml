[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "remote-code-bridge"
dynamic = ["version"]
description = "Run `code .` in any SSH session on a Linux remote and open it in VS Code on your own machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []  # standard library only, on purpose
keywords = ["vscode", "ssh", "remote-development", "tunnel"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/kshitizwagle/remote-code-bridge"

[project.scripts]
remote-code-bridge = "remote_code_bridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6"]

[tool.hatch.version]
path = "remote_code_bridge/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["remote_code_bridge", "tests", "README.md", "LICENSE", "docs"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Print every thread's stack if a test hangs, instead of silently timing out in CI.
faulthandler_timeout = 60
